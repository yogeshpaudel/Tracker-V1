<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Civil Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16191d; --ink-2: #5b6169; --ink-3: #8b9199; --ink-4: #b3b8be;
  --line: #e7e9ec; --line-2: #f1f3f5;
  --page: #f8f8f7; --card: #fff;
  --accent: #2c5fd8; --accent-bg: #eef2fd; --accent-2: #1d4bb5;
  --ok: #1a7f4b; --ok-bg: #e9f7ef;
  --warn: #a86a08; --warn-bg: #fdf3e2;
  --bad: #bc3126; --bad-bg: #fceceb;
  --grey: #6b7178; --grey-bg: #f1f2f4;
  --r: 9px;
  --sh: 0 1px 2px rgba(16,19,23,.05), 0 1px 1px rgba(16,19,23,.03);
  --sh-2: 0 8px 26px rgba(16,19,23,.1), 0 2px 7px rgba(16,19,23,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  background: var(--page); color: var(--ink);
  -webkit-font-smoothing: antialiased; font-size: 14px;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--accent); }

header.top {
  position: sticky; top: 0; z-index: 30; background: #fff;
  border-bottom: 1px solid var(--line); padding: 0 22px;
  display: flex; align-items: center; gap: 20px; height: 56px;
}
.brand { display: flex; align-items: center; gap: 9px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.brand h1 { font-size: 14.5px; }
nav.tabs { display: flex; gap: 2px; margin-left: 8px; }
nav.tabs button {
  border: none; background: none; font: inherit; font-size: 13.5px; color: var(--ink-2);
  padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500;
}
nav.tabs button:hover { background: var(--line-2); color: var(--ink); }
nav.tabs button.on { background: var(--ink); color: #fff; }
.spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer;
       padding: 5px 10px; border-radius: 7px; }
.who:hover { background: var(--line-2); }
.live { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.live.on .dot { background: var(--ok); }
.live.on { color: var(--ok); }

main { padding: 20px 22px 70px; max-width: 1500px; }
.banner { margin: 0; padding: 9px 22px; background: var(--bad-bg); color: var(--bad); font-size: 13px; display: none; }

button.btn { font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; border-radius: 7px;
             padding: 8px 14px; border: 1px solid transparent; transition: background .12s, transform .07s; }
button.btn:active { transform: scale(.98); }
.btn-p { background: var(--ink); color: #fff; }
.btn-p:hover { background: #000; }
.btn-s { background: #fff; color: var(--ink-2); border-color: var(--line); }
.btn-s:hover { background: var(--line-2); color: var(--ink); }
.btn-d { background: var(--bad-bg); color: var(--bad); }
.btn-sm { padding: 5px 9px; font-size: 12.5px; }

.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase;
             letter-spacing: .05em; margin: 26px 0 10px; }
.sec-title:first-child { margin-top: 0; }

.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; box-shadow: var(--sh); }
.kpi .lab { font-size: 12px; color: var(--ink-3); margin-bottom: 5px; }
.kpi .val { font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
.kpi .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.kpi.alert .val { color: var(--bad); }
.kpi.warn .val { color: var(--warn); }
.kpi.good .val { color: var(--ok); }

.card { background: #fff; border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--sh); }
.card-p { padding: 15px 17px; }

table.tbl { width: 100%; border-collapse: collapse; background: #fff; }
table.tbl th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-3);
               text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; border-bottom: 1px solid var(--line); }
table.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover { background: #fafbfc; }
.tbl-wrap { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; box-shadow: var(--sh); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
        padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.pill-accent { background: var(--accent-bg); color: var(--accent); }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-grey { background: var(--grey-bg); color: var(--grey); }

.bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px;
              transition: width .45s cubic-bezier(.2,.7,.3,1); }
.bar.ok > span { background: var(--ok); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }

.qa { display: flex; gap: 3px; }
.qa i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer;
        transition: background .15s, transform .1s; font-style: normal; }
.qa i:hover { transform: scaleY(1.5); }
.qa i.f { background: var(--ok); }
.qa.sm i { height: 5px; }

.pboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 13px; align-items: start; }
.pcard { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 14px 15px;
         box-shadow: var(--sh); cursor: pointer; transition: box-shadow .16s, border-color .16s, transform .16s; }
.pcard:hover { box-shadow: var(--sh-2); border-color: #d9dce0; transform: translateY(-1px); }
.pcard.enter { animation: pop .34s cubic-bezier(.2,.7,.3,1); }
@keyframes pop { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: none; } }

.avatar { width: 23px; height: 23px; border-radius: 50%; color: #fff; font-size: 9.5px; font-weight: 700;
          display: inline-flex; align-items: center; justify-content: center; border: 2px solid #fff; }
.avstack { display: flex; }
.avstack .avatar + .avatar { margin-left: -6px; }

.gridtbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
.gridtbl th, .gridtbl td { border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); padding: 9px 11px; }
.gridtbl th { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase;
              letter-spacing: .04em; background: #fbfbfa; position: sticky; top: 0; z-index: 5; }
.gridtbl th:last-child, .gridtbl td:last-child { border-right: none; }
.gridtbl .namecol { position: sticky; left: 0; background: #fff; z-index: 4; min-width: 190px; }
.gridtbl th.namecol { z-index: 6; background: #fbfbfa; }
.grid-scroll { max-height: 68vh; overflow: auto; border-radius: 11px; }
.cell { min-width: 132px; }
.cell.na { background: #fbfbfa; }
.cellinner { display: flex; flex-direction: column; gap: 5px; }
.cellrow { display: flex; align-items: center; gap: 6px; }
.cellrow label { font-size: 10.5px; color: var(--ink-3); width: 26px; flex: none; font-weight: 600; }

.modal-bg { position: fixed; inset: 0; background: rgba(16,19,23,.4); z-index: 60; display: none;
            align-items: flex-start; justify-content: center; padding: 44px 16px; overflow: auto;
            animation: fade .14s ease; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.modal { background: #fff; border-radius: 13px; box-shadow: 0 22px 60px rgba(16,19,23,.22);
         width: 620px; max-width: 100%; padding: 22px 24px; }
.modal.wide { width: 860px; }
.modal h3 { font-size: 16px; margin-bottom: 4px; }
.modal .sub { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
.f { margin-bottom: 11px; }
.f label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }
.f input, .f select, .f textarea {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 13.5px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
}
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.f3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; }
.acts { display: flex; gap: 9px; justify-content: flex-end; margin-top: 17px; }
.box { background: var(--page); border-radius: 9px; padding: 12px 13px; margin-bottom: 12px; }

.empty { text-align: center; padding: 46px 20px; color: var(--ink-3); }
.empty h3 { font-size: 15px; color: var(--ink); margin-bottom: 6px; }
.empty p { margin: 0 0 14px; font-size: 13.5px; }

.cmt { padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.cmt:last-child { border-bottom: none; }
.cmt .meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; }
.cmt .who { font-weight: 600; color: var(--ink-2); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px;
        background: var(--line-2); font-size: 12px; color: var(--ink-2); }
.link-ico { color: var(--accent); text-decoration: none; font-size: 12px; }
.warnbox { background: var(--warn-bg); border: 1px solid #f3dcae; border-radius: 9px; padding: 11px 13px;
           font-size: 13px; color: var(--warn); margin-bottom: 12px; }
.badbox { background: var(--bad-bg); border: 1px solid #f3cbc7; border-radius: 9px; padding: 11px 13px;
          font-size: 13px; color: var(--bad); margin-bottom: 12px; }
.okbox { background: var(--ok-bg); border: 1px solid #bfe4cf; border-radius: 9px; padding: 11px 13px;
         font-size: 13px; color: var(--ok); margin-bottom: 12px; }
.hr { height: 1px; background: var(--line); margin: 16px 0; }
.backlink { background: none; border: none; font: inherit; font-size: 13px; color: var(--ink-2);
            cursor: pointer; padding: 4px 0; }
.backlink:hover { color: var(--ink); }
.iconbtn { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 14px;
           padding: 3px 5px; border-radius: 5px; line-height: 1; }
.iconbtn:hover { background: var(--line-2); color: var(--ink); }
.scroll-x { overflow-x: auto; }

/* ===== v2 additions ===== */
.session-bg { position: fixed; inset: 0; background: #16191d; z-index: 100; display: none;
              align-items: center; justify-content: center; }
.session-card { background: #fff; border-radius: 14px; padding: 30px 32px; width: 380px; max-width: 90vw;
                box-shadow: 0 22px 60px rgba(0,0,0,.3); text-align: center; }
.session-card h2 { font-size: 17px; margin-bottom: 6px; }
.session-card p { font-size: 13px; color: var(--ink-3); margin-bottom: 18px; }

.calcgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.calcgrid .cs { height: 16px; border-radius: 4px; background: var(--line); cursor: pointer; position: relative;
                transition: background .15s, transform .1s; display: flex; align-items: center; justify-content: center; }
.calcgrid .cs:hover { transform: scale(1.08); }
.calcgrid .cs.done { background: var(--ok); }
.calcgrid .cs.review { background: var(--line); border: 1.5px dashed var(--ink-4); }
.calcgrid .cs.review.done { background: var(--accent); border-style: solid; }
.calcgrid.sm { grid-template-columns: repeat(6, 1fr); }
.calcgrid.sm .cs { height: 11px; border-radius: 3px; }

.stepline { display: flex; align-items: center; justify-content: space-between; padding: 7px 0;
            border-bottom: 1px solid var(--line-2); }
.stepline:last-child { border-bottom: none; }
.stepline .name { font-size: 13px; }
.stepline .name .w { color: var(--ink-3); font-size: 11px; margin-left: 5px; }
.steptoggle { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); background: #fff;
              cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
.steptoggle.on { background: var(--ok); border-color: var(--ok); }
.steptoggle.on::after { content: "✓"; }

.rolebox { border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-bottom: 12px; }
.rolebox .rb-head { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase;
                     letter-spacing: .04em; margin-bottom: 10px; }

.gridcell { display: flex; flex-direction: column; gap: 6px; padding: 2px 0; }
.gc-row { display: flex; align-items: center; gap: 6px; }
.gc-row label { font-size: 9.5px; color: var(--ink-3); width: 24px; flex: none; font-weight: 700; text-transform: uppercase; }
.gc-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }

.status-locked { opacity: .45; pointer-events: none; }
select:disabled { background: var(--line-2); color: var(--ink-3); }
.datefact { font-size: 11.5px; color: var(--ink-3); padding: 6px 0; }

/* ===== toasts ===== */
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: #fff; padding: 11px 14px; border-radius: 9px; font-size: 13px;
         box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 14px;
         animation: toastIn .2s cubic-bezier(.2,.7,.3,1); max-width: 360px; }
.toast.out { animation: toastOut .18s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(4px); } }
.toast-act { background: rgba(255,255,255,.15); border: none; color: #fff; font: inherit; font-weight: 600;
             padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.toast-act:hover { background: rgba(255,255,255,.25); }

/* ===== activity feed ===== */
.afeed { display: flex; flex-direction: column; }
.aitem { display: flex; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.aitem:last-child { border-bottom: none; }
.aitem .adot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.aitem .atext { flex: 1; }
.aitem .awho { font-weight: 600; }
.aitem .awhen { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ===== bulk select ===== */
.bulkbar { display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 9px;
           padding: 9px 13px; margin-bottom: 12px; font-size: 13px; }
.bulkbar select, .bulkbar button { font-size: 12.5px; }
.picklist { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pickrow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.pickrow:last-child { border-bottom: none; }
.pickrow input { width: auto; }
.toggle-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle-row input { width: auto; }


</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark">C</div>
    <div>
      <h1>Civil Project Tracker</h1>
      <div class="live" id="live"><span class="dot"></span><span id="live-text">Connecting…</span></div>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <div class="who" id="who"><span id="who-name">Set your name</span></div>
</header>

<div class="banner" id="banner"></div>
<main id="main"></main>
<div class="modal-bg" id="modal-bg"></div>
<div class="session-bg" id="session-bg"></div>
<div id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc,
  serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ===================== v2 engine =====================
const PHASES = ["30", "60", "90", "IFC"];
const PHASE_TARGET = { "30": 30, "60": 60, "90": 90, "IFC": 100 };

// ---- Calc: 6 non-sequential steps. Weights sum to 100. ----
// 5 of them (all but "review") are the engineer's own authored work.
const CALC_STEPS = [
  { key: "criteria", label: "Design criteria finalized", weight: 5, owner: "engineer" },
  { key: "loads", label: "Load calculation / development", weight: 25, owner: "engineer" },
  { key: "modelling", label: "Structure modelling & analysis", weight: 30, owner: "engineer" },
  { key: "report", label: "Structure report prepared", weight: 25, owner: "engineer" },
  { key: "review", label: "Reviewed", weight: 10, owner: "reviewer" },
  { key: "comments", label: "Comments addressed", weight: 5, owner: "engineer" }
];
const CALC_ENGINEER_WEIGHT = CALC_STEPS.filter(s => s.owner === "engineer").reduce((a, s) => a + s.weight, 0); // 90

const DRAW_LABEL = ["Not started", "Q1 Self check", "Q2 Engineer check", "Q3 Independent review", "Q4 PE review"];
const REVIEW_COST_DAYS = 0.5; // fixed 4hr cost for any review step, calc or drawing

const KA_STATUS = ["Waiting for information", "In progress", "Submitted", "On hold"];
const CLIENT_STATUS = ["Not submitted", "Submitted for review", "Client comments received"];
const BLOCK_REASONS = ["Waiting on client", "Waiting on reviewer", "Waiting on info", "Waiting on other discipline"];

const CALC_WEIGHT_DEFAULT = 0.6;
const STALE_WORKING_DAYS = 3;

// ---------------- calc progress ----------------
function calcProgress(s) {
  const steps = (s && s.calcSteps) || {};
  return CALC_STEPS.reduce((a, st) => a + (steps[st.key] ? st.weight : 0), 0);
}
function calcEngineerDoneWeight(s) {
  const steps = (s && s.calcSteps) || {};
  return CALC_STEPS.filter(st => st.owner === "engineer" && steps[st.key]).reduce((a, st) => a + st.weight, 0);
}
function calcReviewDone(s) {
  return !!((s && s.calcSteps) || {}).review;
}

// ---------------- drawing progress ----------------
function drawProgress(s) {
  const n = Math.max(0, Math.min(4, Number(s && s.drawQ) || 0));
  return n * 25;
}

// ---------------- structure / phase / project progress ----------------
function structureProgress(s, calcWeight = CALC_WEIGHT_DEFAULT) {
  const dw = 1 - calcWeight;
  return calcProgress(s) * calcWeight + drawProgress(s) * dw;
}
function phaseStructureProgress(structures, calcWeight = CALC_WEIGHT_DEFAULT) {
  if (!structures.length) return 0;
  return structures.reduce((a, s) => a + structureProgress(s, calcWeight), 0) / structures.length;
}
// A phase whose K&A status is Submitted counts as 100% for rollup, regardless of structure detail (CL-06).
function phaseProgress(phase, structures, calcWeight = CALC_WEIGHT_DEFAULT) {
  if (phase && phase.kaStatus === "Submitted") return 100;
  return phaseStructureProgress(structures, calcWeight);
}

function includedPhases(project) {
  const ph = project.phases || {};
  return PHASES.filter(p => ph[p] && ph[p].included !== false);
}
function phaseSlices(project) {
  const inc = includedPhases(project);
  const slices = [];
  let prev = 0;
  inc.forEach(p => {
    const target = PHASE_TARGET[p];
    slices.push({ phase: p, from: prev, to: target, span: target - prev });
    prev = target;
  });
  if (slices.length) {
    const last = slices[slices.length - 1];
    if (last.to < 100) { last.to = 100; last.span = 100 - last.from; }
  }
  return slices;
}
function projectProgress(project, structuresByPhase, calcWeight = CALC_WEIGHT_DEFAULT) {
  const slices = phaseSlices(project);
  if (!slices.length) return 0;
  let total = 0;
  slices.forEach(sl => {
    const phase = project.phases[sl.phase];
    const list = structuresByPhase[sl.phase] || [];
    const pp = phaseProgress(phase, list, calcWeight) / 100;
    total += pp * sl.span;
  });
  return Math.max(0, Math.min(100, total));
}
// Whole project is done once every included phase has been Submitted.
function projectComplete(project) {
  const inc = includedPhases(project);
  if (!inc.length) return false;
  return inc.every(p => project.phases[p] && project.phases[p].kaStatus === "Submitted");
}

// ---------------- dates ----------------
function parseDate(d) {
  if (!d) return null;
  const dt = d instanceof Date ? d : new Date(d + (String(d).length === 10 ? "T00:00:00" : ""));
  return isNaN(dt.getTime()) ? null : dt;
}
function workingDaysBetween(from, to) {
  const a = parseDate(from), b = parseDate(to);
  if (!a || !b) return 0;
  const sign = b < a ? -1 : 1;
  let start = sign > 0 ? new Date(a) : new Date(b);
  const end = sign > 0 ? new Date(b) : new Date(a);
  let count = 0;
  start.setHours(0, 0, 0, 0); end.setHours(0, 0, 0, 0);
  while (start < end) {
    start.setDate(start.getDate() + 1);
    const day = start.getDay();
    if (day !== 0 && day !== 6) count++;
  }
  return count * sign;
}
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

// ---------------- per-person remaining effort ----------------
// Engineer's own remaining calc work, normalized against the 90% they own (review excluded).
function engineerRemainingDays(s) {
  const est = Number(s.calcEstDays) || 0;
  const done = calcEngineerDoneWeight(s); // 0..90
  return est * (1 - done / CALC_ENGINEER_WEIGHT);
}
// Designer's own remaining drawing work: done once Q1 (self-check) is reached.
function designerRemainingDays(s) {
  const est = Number(s.drawEstDays) || 0;
  return (Number(s.drawQ) || 0) >= 1 ? 0 : est;
}
function calcReviewRemainingDays(s) { return calcReviewDone(s) ? 0 : REVIEW_COST_DAYS; }
function drawQ2RemainingDays(s) { return (Number(s.drawQ) || 0) >= 2 ? 0 : REVIEW_COST_DAYS; }
function drawQ3RemainingDays(s) { return (Number(s.drawQ) || 0) >= 3 ? 0 : REVIEW_COST_DAYS; }
function drawQ4RemainingDays(s) { return (Number(s.drawQ) || 0) >= 4 ? 0 : REVIEW_COST_DAYS; }

// Returns [{role, days}] for every role personId holds on structure s, with days > 0 only when work remains.
function personRolesOnStructure(s, personId) {
  const out = [];
  if (!personId) return out;
  if (s.engineerId === personId) out.push({ role: "Engineer (calc)", days: engineerRemainingDays(s) });
  if (s.calcReviewerId === personId) out.push({ role: "Calc reviewer", days: calcReviewRemainingDays(s) });
  if (s.designerId === personId) out.push({ role: "Designer (drawing)", days: designerRemainingDays(s) });
  if (s.drawQ2ReviewerId === personId) out.push({ role: "Drawing Q2 reviewer", days: drawQ2RemainingDays(s) });
  if (s.drawQ3ReviewerId === personId) out.push({ role: "Drawing Q3 reviewer", days: drawQ3RemainingDays(s) });
  if (s.drawQ4ReviewerId === personId) out.push({ role: "Drawing Q4 reviewer", days: drawQ4RemainingDays(s) });
  return out;
}
function personRemainingOnStructure(s, personId) {
  return personRolesOnStructure(s, personId).reduce((a, r) => a + r.days, 0);
}
function structureTotalRemainingDays(s) {
  return engineerRemainingDays(s) + calcReviewRemainingDays(s) + designerRemainingDays(s)
    + drawQ2RemainingDays(s) + drawQ3RemainingDays(s) + drawQ4RemainingDays(s);
}

// ---------------- availability & slack ----------------
function availabilityFactor(person, from, to) {
  const blocks = (person && person.availability) || [];
  const a = parseDate(from), b = parseDate(to);
  if (!a || !b || b <= a) return 1;
  let totalDays = 0, weighted = 0;
  const cur = new Date(a);
  while (cur < b) {
    const day = cur.getDay();
    if (day !== 0 && day !== 6) {
      totalDays++;
      let pct = 100;
      blocks.forEach(bl => {
        const s = parseDate(bl.from), e = parseDate(bl.to);
        if (s && e && cur >= s && cur <= e) pct = Math.min(pct, Number(bl.percent) || 0);
      });
      weighted += pct / 100;
    }
    cur.setDate(cur.getDate() + 1);
  }
  return totalDays === 0 ? 1 : weighted / totalDays;
}
// Slack for a specific person's specific role-load on a structure, against a deadline.
function slackDaysFor(remainingDays, deadline, person, today = new Date()) {
  const dl = parseDate(deadline);
  if (!dl) return null;
  const avail = availabilityFactor(person, today, dl);
  const capacityDays = workingDaysBetween(today, dl) * (avail <= 0 ? 0.0001 : avail);
  return capacityDays - remainingDays;
}

function isActionable(s) {
  if (s.blockedReason) return false;
  const calcDone = calcProgress(s) >= 100;
  const drawDone = drawProgress(s) >= 100;
  return !(calcDone && drawDone);
}
function isStale(s, today = new Date()) {
  if (!isActionable(s)) return false;
  const last = parseDate(s.lastTouched);
  if (!last) return false;
  return workingDaysBetween(last, today) >= STALE_WORKING_DAYS;
}

// ---------------- pace / risk ----------------
function expectedProgress(phase, today = new Date()) {
  const start = parseDate(phase && phase.startDate);
  const end = parseDate(phase && phase.deadline);
  if (!start || !end || end <= start) return null;
  const total = end - start;
  const elapsed = Math.max(0, Math.min(total, today - start));
  return (elapsed / total) * 100;
}
function paceIndex(actualPct, expectedPct) {
  if (expectedPct == null || expectedPct <= 0) return null;
  return actualPct / expectedPct;
}
function activePhase(project) {
  const inc = includedPhases(project);
  for (const p of inc) {
    const ph = project.phases[p];
    if (ph.kaStatus !== "Submitted") return p;
  }
  return inc.length ? inc[inc.length - 1] : null;
}
function daysWaitingOnClient(phase, today = new Date()) {
  // Only meaningful once submitted and client hasn't responded, and not IFC (CL-07: IFC has no client tracking).
  if (!phase || phase.kaStatus !== "Submitted") return null;
  if (phase.clientStatus !== "Submitted for review") return null;
  const d = parseDate(phase.submittedDate);
  if (!d) return null;
  return workingDaysBetween(d, today);
}
function slipDays(phase) {
  const planned = parseDate(phase && phase.originalDeadline);
  const actual = parseDate(phase && phase.submittedDate);
  if (!planned || !actual) return null;
  return workingDaysBetween(planned, actual);
}
function projectRisk(project, structuresByPhase, today = new Date()) {
  const ap = activePhase(project);
  if (!ap) return { score: 0, reasons: [] };
  const ph = project.phases[ap] || {};
  const reasons = [];
  let score = 0;

  const dl = parseDate(ph.deadline);
  if (dl) {
    const days = workingDaysBetween(today, dl);
    if (days < 0) { score += 60; reasons.push("Deadline passed"); }
    else if (days <= 5) { score += 40; reasons.push("Due within a week"); }
    else if (days <= 15) { score += 20; reasons.push("Due within 3 weeks"); }
  }

  const list = structuresByPhase[ap] || [];
  const actual = phaseStructureProgress(list);
  const exp = expectedProgress(ph, today);
  const pi = paceIndex(actual, exp);
  if (pi != null && pi < 0.9) {
    score += Math.min(40, Math.round((1 - pi) * 60));
    reasons.push("Behind pace");
  }

  const staleCount = list.filter(s => isStale(s, today)).length;
  if (staleCount) { score += Math.min(15, staleCount * 5); reasons.push(staleCount + " not updated recently"); }

  const blocked = list.filter(s => s.blockedReason).length;
  if (blocked) { score += Math.min(10, blocked * 3); reasons.push(blocked + " blocked"); }

  if (ph.kaStatus === "Submitted") { score = Math.max(0, score - 25); reasons.push("Submitted"); }
  if (ph.kaStatus === "On hold") { score += 20; reasons.push("On hold"); }

  return { score, reasons, phase: ap, actual, expected: exp, pace: pi };
}

// ---------------- reassignment suggestion ----------------
// Suggests other people who could take over a specific ROLE (engineer/designer/reviewer) on a structure.
function suggestReassignment(structure, role, roleField, deadline, people, allStructures, projectsById, today = new Date()) {
  const roleWantsList = { engineerId: "Engineer", designerId: "Designer" };
  const wantRole = roleWantsList[roleField]; // null for reviewer fields -> anyone with Engineer or Lead role can review
  const candidates = people.filter(p => p.id !== structure[roleField] &&
    (wantRole ? (p.roles || []).includes(wantRole) : true));

  return candidates.map(p => {
    const theirLoad = allStructures.filter(s => personRemainingOnStructure(s, p.id) > 0 && isActionable(s));
    let worst = null;
    theirLoad.forEach(s => {
      const proj = projectsById[s.projectId];
      const dl = proj && proj.phases && proj.phases[s.phase] ? proj.phases[s.phase].deadline : null;
      const rem = personRemainingOnStructure(s, p.id);
      const sl = slackDaysFor(rem, dl, p, today);
      if (sl != null && (worst == null || sl < worst)) worst = sl;
    });
    let projectedRemaining;
    if (roleField === "engineerId") projectedRemaining = engineerRemainingDays(structure);
    else if (roleField === "designerId") projectedRemaining = designerRemainingDays(structure);
    else if (roleField === "calcReviewerId") projectedRemaining = REVIEW_COST_DAYS;
    else projectedRemaining = REVIEW_COST_DAYS;
    const projected = slackDaysFor(projectedRemaining, deadline, p, today);
    return { person: p, currentLoad: theirLoad.length, worstSlack: worst, projectedSlack: projected };
  }).filter(c => c.projectedSlack != null && c.projectedSlack > 0)
    .sort((a, b) => b.projectedSlack - a.projectedSlack);
}

// ---------------- formatting ----------------
function fmtDate(d) {
  const dt = parseDate(d);
  if (!dt) return "—";
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtShort(d) {
  const dt = parseDate(d);
  if (!dt) return "—";
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function round(n, dp = 0) {
  const f = Math.pow(10, dp);
  return Math.round((Number(n) || 0) * f) / f;
}

// ---------------- phase status transitions (CL-01/02/03) ----------------
// Call whenever a phase's kaStatus is changed by the user, to auto-stamp dates & client status.
function applyKaStatusChange(phase, newStatus, today = todayISO()) {
  const p = { ...phase, kaStatus: newStatus };
  if (newStatus === "In progress" && !p.startDate) p.startDate = today;
  if (newStatus === "Submitted") {
    if (!p.submittedDate) p.submittedDate = today;
    if (!p.originalDeadline) p.originalDeadline = p.deadline;
    p.clientStatus = "Submitted for review";
  }
  if (newStatus !== "Submitted" && p.clientStatus && p.clientStatus !== "Not submitted" && newStatus !== "On hold") {
    // moved back out of Submitted (e.g. corrected) -> client status resets
    p.clientStatus = "Not submitted";
  }
  return p;
}

function projProgress(p) { return projectProgress(p, byPhase(structuresOf(p.id)), p.calcWeight || 0.6); }
function deadlineFor(s) {
  const p = state.projects.find(x => x.id === s.projectId);
  return p && p.phases && p.phases[s.phase] ? p.phases[s.phase].deadline : null;
}
function personBy(id) { return state.people.find(x => x.id === id) || null; }
function paceKind(pi) { if (pi == null) return ""; if (pi >= 0.95) return "ok"; if (pi >= 0.8) return "warn"; return "bad"; }
function spareKind(days) { return days < 0 ? "bad" : days < 3 ? "warn" : "ok"; }
function spareText(days) {
  const d = round(Math.abs(days), 1);
  return days < 0 ? `${d}d short` : `${d}d spare`;
}
function kaKind(k) { return k === "Submitted" ? "ok" : k === "On hold" ? "bad" : k === "Waiting for information" ? "warn" : "accent"; }
function clientKind(c) { return c === "Client comments received" ? "ok" : c === "Submitted for review" ? "accent" : "grey"; }

// Every (structure, role) pair the given person currently holds, across every project.
function myAssignments(personId) {
  if (!personId) return [];
  const out = [];
  activeStructures().forEach(s => {
    personRolesOnStructure(s, personId).forEach(r => {
      if (r.days > 0) out.push({ s, role: r.role, days: r.days });
    });
  });
  return out;
}

/* ---------------- INSIGHTS ---------------- */
function renderInsights() {
  const P = activeProjects(), ST = activeStructures();
  const today = new Date();
  const active = P.filter(p => !projectComplete(p));
  const risks = active.map(p => ({ p, r: projectRisk(p, byPhase(structuresOf(p.id)), today) }));
  const atRisk = risks.filter(x => x.r.score >= 45);
  const stale = ST.filter(s => isStale(s, today));
  const blocked = ST.filter(s => s.blockedReason);

  const awaiting = [];
  P.forEach(p => PHASES.forEach(ph => {
    const phase = p.phases && p.phases[ph];
    if (!phase || ph === "IFC") return; // CL-07: no client tracking on IFC
    const d = daysWaitingOnClient(phase, today);
    if (d != null) awaiting.push({ p, ph, days: d });
  }));
  awaiting.sort((a, b) => b.days - a.days);

  // Negative-slack rollup: one row per (structure, role) that's underwater.
  const negSlack = [];
  ST.filter(s => isActionable(s)).forEach(s => {
    const dl = deadlineFor(s);
    [["engineerId", "Engineer (calc)", engineerRemainingDays], ["calcReviewerId", "Calc reviewer", calcReviewRemainingDays],
     ["designerId", "Designer (drawing)", designerRemainingDays], ["drawQ2ReviewerId", "Drawing Q2", drawQ2RemainingDays],
     ["drawQ3ReviewerId", "Drawing Q3", drawQ3RemainingDays], ["drawQ4ReviewerId", "Drawing Q4", drawQ4RemainingDays]]
      .forEach(([field, roleLabel, fn]) => {
        const pid = s[field];
        if (!pid) return;
        const days = fn(s);
        if (days <= 0) return;
        const sl = slackDaysFor(days, dl, personBy(pid), today);
        if (sl != null && sl < 0) negSlack.push({ s, pid, roleLabel, field, sl });
      });
  });
  negSlack.sort((a, b) => a.sl - b.sl);

  // Drawing pipeline: counts stop only once the WHOLE project wraps up, not when one structure finishes -
  // a finished drawing still shows, just moves into the "Completed" bucket instead of vanishing.
  const drawBuckets = { notstarted: [], q1: [], q2: [], q3: [], q4: [], completed: [] };
  activeStructures().forEach(s => {
    const proj = state.projects.find(x => x.id === s.projectId);
    if (!proj || projectComplete(proj)) return;
    const dq = Number(s.drawQ) || 0;
    const fullyDone = calcProgress(s) >= 100 && dq >= 4;
    if (fullyDone) drawBuckets.completed.push(s);
    else if (dq <= 0) drawBuckets.notstarted.push(s);
    else if (dq === 1) drawBuckets.q1.push(s);
    else if (dq === 2) drawBuckets.q2.push(s);
    else if (dq === 3) drawBuckets.q3.push(s);
    else drawBuckets.q4.push(s);
  });
  view.drawBuckets = drawBuckets;

  let h = `<div class="between" style="margin-bottom:16px">
    <div><h2 style="font-size:17px">Insights</h2>
    <div class="small muted">Portfolio health across ${active.length} active project${active.length === 1 ? "" : "s"}</div></div>
  </div>`;

  h += `<div class="grid kpis">
    ${kpi("Active projects", active.length, "")}
    ${kpi("At risk", atRisk.length, atRisk.length ? "alert" : "good", atRisk.length ? "behind pace or due soon" : "all on track")}
    ${kpi("Can't finish on time", negSlack.length, negSlack.length ? "alert" : "good", "assignments that need more time or a new deadline")}
    ${kpi("Not updated recently", stale.length, stale.length ? "warn" : "good", "no progress logged in 3+ working days")}
    ${kpi("Blocked", blocked.length, blocked.length ? "warn" : "", "waiting on someone")}
    ${kpi("Awaiting client", awaiting.length, awaiting.length ? "warn" : "", awaiting.length ? `oldest ${awaiting[0].days} wd` : "none pending")}
  </div>`;

  if (negSlack.length) {
    h += `<div class="sec-title">Overload — needs a decision</div><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Structure</th><th>Project / phase</th><th>Role</th><th>Person</th><th>Time to spare</th><th></th></tr></thead><tbody>`;
    negSlack.slice(0, 12).forEach(({ s, pid, roleLabel, field, sl }) => {
      const p = state.projects.find(x => x.id === s.projectId);
      h += `<tr><td><strong>${esc(s.name)}</strong></td>
        <td class="small muted">${esc(p ? p.name : "?")} · ${esc(s.phase)}%</td>
        <td class="small">${esc(roleLabel)}</td>
        <td>${avatar(personName(pid))} <span class="small">${esc(personName(pid))}</span></td>
        <td>${pill(spareText(sl), "bad")}</td>
        <td><button class="btn btn-s btn-sm" onclick="window.__suggest('${s.id}','${field}')">Who can take it</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  h += `<div class="sec-title">Project health</div>`;
  if (!active.length) {
    h += emptyState("No active projects", "Create one in the Projects tab.");
  } else {
    h += `<div class="pboard">`;
    risks.sort((a, b) => b.r.score - a.r.score).forEach(({ p, r }) => {
      const pp = projProgress(p);
      const ph = r.phase ? p.phases[r.phase] : null;
      const statusPill = r.score >= 45 ? pill("At risk", "bad") : r.score >= 25 ? pill("Watch", "warn") : pill("On track", "ok");
      h += `<div class="pcard" onclick="window.__openProject('${p.id}')">
        <div class="between" style="align-items:flex-start">
          <div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.04em">${esc(p.client || "—")}</div>
            <div style="font-weight:600;font-size:15px;margin-top:2px">${esc(p.name)}</div></div>
          ${statusPill}
        </div>
        <div style="margin:12px 0 4px">${bar(pp)}</div>
        <div class="between tiny muted"><span>${round(pp)}% overall</span>
          <span>${r.phase ? r.phase + "% phase" : ""}${ph && ph.deadline ? " · due " + fmtShort(ph.deadline) : ""}</span></div>
        ${r.pace != null ? `<div class="tiny muted" style="margin-top:4px">Moving at ${round(r.pace * 100)}% of the speed needed to hit this deadline</div>` : ""}
        ${r.reasons.length ? `<div class="row" style="gap:5px;flex-wrap:wrap;margin-top:9px">${r.reasons.map(x => pill(x, "warn")).join("")}</div>` : ""}
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="sec-title">Drawings — where work is sitting</div>
    <div class="small muted" style="margin:-6px 0 10px">Click a number to see those drawings. A drawing stays visible here — even once finished — until its whole project wraps up.</div>
    <div class="card card-p"><div class="grid" style="grid-template-columns:repeat(6,1fr)">`;
  [["notstarted", "Not started"], ["q1", "Q1"], ["q2", "Q2"], ["q3", "Q3"], ["q4", "Q4"], ["completed", "Completed"]].forEach(([key, lab]) => {
    h += `<div style="cursor:pointer" onclick="window.__showDrawingBucket('${key}')">
      <div class="tiny muted">${lab}</div>
      <div style="font-size:20px;font-weight:600;color:var(--accent)">${drawBuckets[key].length}</div></div>`;
  });
  h += `</div></div>`;

  h += `<div class="sec-title">Workload — every role counted</div>`;
  const people = activePeople();
  if (!people.length) {
    h += emptyState("No team members yet", "Add your team so workload and available time can be tracked.", `<button class="btn btn-p" onclick="window.__go('team')">Go to Team</button>`);
  } else {
    h += `<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Person</th><th>Active assignments</th><th>Total remaining</th><th>Least time to spare</th></tr></thead><tbody>`;
    people.forEach(p => {
      const mine = myAssignments(p.id);
      const totalDays = mine.reduce((a, x) => a + x.days, 0);
      let worst = null;
      mine.forEach(({ s, days }) => {
        const sl = slackDaysFor(days, deadlineFor(s), p, today);
        if (sl != null && (worst == null || sl < worst)) worst = sl;
      });
      h += `<tr><td>${avatar(p.name)} <span style="margin-left:6px">${esc(p.name)}</span>
          <div class="tiny muted" style="margin-left:29px">${esc((p.roles || []).join(", "))}</div></td>
        <td>${mine.length}</td>
        <td class="small">${round(totalDays, 1)} d</td>
        <td>${worst == null ? '<span class="tiny muted">—</span>' : pill(spareText(worst), spareKind(worst))}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}
function kpi(lab, v, kind, sub) {
  return `<div class="kpi ${kind || ""}"><div class="lab">${esc(lab)}</div><div class="val">${v}</div>
    ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>`;
}
function emptyState(title, msg, action) {
  return `<div class="card"><div class="empty"><h3>${esc(title)}</h3><p>${esc(msg)}</p>${action || ""}</div></div>`;
}

  const today = new Date();

  list.sort((a, b) => b.r.score - a.r.score);

  let h = `<div class="between" style="margin-bottom:16px">
    <div><h2 style="font-size:17px">Projects</h2>

      ${completedCount ? `<label class="toggle-row"><input type="checkbox" id="show-completed" ${view.showCompleted ? "checked" : ""}

      <button class="btn btn-p" onclick="window.__newProject()">+ New project</button>

    view.showCompleted ? "No projects yet" : "No active projects",
    view.showCompleted ? "Create your first project to get started." : "Everything's complete, or nothing's been created yet.",
    `<button class="btn btn-p" onclick="window.__newProject()">+ New project</button>`);

  h += `<div class="pboard">`;

    const isNew = view.prevRisk[p.id] === undefined;

    const st = structuresOf(p.id);
    const staleN = st.filter(s => isStale(s, today)).length;

    h += `<div class="pcard ${isNew || moved ? "enter" : ""}" onclick="window.__openProject('${p.id}')">
      <div class="between" style="align-items:flex-start">
        <div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.04em">${esc(p.client || "—")}</div>
          <div style="font-weight:600;font-size:14.5px;margin-top:2px">${esc(p.name)}</div></div>
        ${complete ? pill("Complete", "ok") : r.phase ? pill(r.phase + "%", "accent") : ""}
      </div>
      <div style="margin:11px 0 4px">${bar(prog)}</div>
      <div class="between tiny muted"><span>${round(prog)}% overall</span>
        <span>${ph && ph.deadline ? fmtShort(ph.deadline) : "no deadline"}</span></div>
      <div style="margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2)" class="between">

        </div>
        ${complete ? "" : r.score >= 45 ? pill("At risk", "bad") : r.score >= 25 ? pill("Watch", "warn") : pill("On track", "ok")}
      </div></div>`;
  });
  return h + `</div>`;
}

    h += `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Roles</th><th>Availability</th><th></th></tr></thead><tbody>`;

  const delPeople = state.people.filter(p => p.deleted);
  const delProjects = state.projects.filter(p => p.deleted);
  const delStructures = state.structures.filter(s => s.deleted);
  if (delPeople.length || delProjects.length || delStructures.length) {

      const proj = state.projects.find(x => x.id === s.projectId);
      h += `<tr><td><strong>${esc(s.name)}</strong><div class="tiny muted">${esc(proj ? proj.name : "")}</div></td>
        <td class="small">Structure</td><td class="small muted">${fmtShort(s.deletedAt)}</td>
        <td style="text-align:right"><button class="btn btn-s btn-sm" onclick="window.__restoreStructure('${s.id}')">Restore</button></td></tr>`;
    });
    delPeople.forEach(p => {
      h += `<tr><td><strong>${esc(p.name)}</strong></td><td class="small">Person</td><td class="small muted">${fmtShort(p.deletedAt)}</td>
        <td style="text-align:right"><button class="btn btn-s btn-sm" onclick="window.__restorePerson('${p.id}')">Restore</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  h += `<div class="sec-title">Structure types &amp; estimates</div>
    <div class="small muted" style="margin-bottom:10px">Default calc/drawing days per type. New structures inherit these; override per structure.</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn btn-p btn-sm" onclick="window.__editType()">+ Add type</button>
      ${state.structureTypes.length ? "" : `<button class="btn btn-s btn-sm" onclick="window.__seedTypes()">Load starter list</button>`}
    </div>`;
  if (!state.structureTypes.length) {
    h += emptyState("No structure types", "Load the starter list of common substation structures, then edit to match your practice.",
      `<button class="btn btn-p" onclick="window.__seedTypes()">Load starter list</button>`);
  } else {
    h += `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Calc days</th><th>Drawing days</th><th></th></tr></thead><tbody>`;
    state.structureTypes.forEach(t => {
      h += `<tr><td style="font-weight:500">${esc(t.name)}</td><td>${t.calcEstDays}</td><td>${t.drawEstDays}</td>
        <td style="text-align:right"><button class="iconbtn" onclick="window.__editType('${t.id}')">&#9998;</button>
          <button class="iconbtn" onclick="window.__delType('${t.id}')">&#10005;</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

window.__newProject = () => projectModal(null);

function projectModal(id) {
  const p = id ? state.projects.find(x => x.id === id) : null;
  const people = activePeople();
  openModal({
    wide: true,
    body: `<h3>${p ? "Edit project" : "New project"}</h3><p class="sub">Phases can be excluded if the client skips them — progress reweights automatically.</p>
    <div class="f2"><div class="f"><label>Project name</label><input id="p-name" value="${esc(p ? p.name : "")}" placeholder="Golf Mill substation" /></div>
      <div class="f"><label>Client</label><input id="p-client" value="${esc(p ? p.client : "")}" placeholder="COMED" /></div></div>
    <div class="f3"><div class="f"><label>Manager</label><select id="p-mgr">${opts(people, p ? p.managerId : "", "id", "name", "—")}</select></div>
      <div class="f"><label>Lead engineer</label><select id="p-lead">${opts(people, p ? p.leadId : "", "id", "name", "—")}</select></div>
      <div class="f"><label>Calc weight</label><select id="p-cw">
        ${[["0.6", "60% calc / 40% drawing"], ["0.5", "50 / 50"], ["0.7", "70 / 30"]].map(([v, l]) =>
      `<option value="${v}" ${p && String(p.calcWeight) === v ? "selected" : ""}>${l}</option>`).join("")}
      </select></div></div>
    <div class="sec-title" style="margin:14px 0 8px">Phases</div>
    ${PHASES.map(ph => {
      const d = p && p.phases && p.phases[ph] ? p.phases[ph] : newProjectShell("", "").phases[ph];
      const facts = [
        d.startDate ? `Started ${fmtShort(d.startDate)}` : null,
        d.submittedDate ? `Submitted ${fmtShort(d.submittedDate)}` : null
      ].filter(Boolean).join(" · ");
      const clientLocked = d.kaStatus !== "Submitted";
      return `<div class="box"><div class="row" style="gap:14px;flex-wrap:wrap;align-items:flex-end">
        <label class="row" style="gap:6px;font-size:13px;min-width:70px">
          <input type="checkbox" id="ph-${ph}-inc" ${d.included !== false ? "checked" : ""} style="width:auto" /> <strong>${ph}%</strong></label>
        <div class="f" style="margin:0;flex:1;min-width:130px"><label>Deadline</label><input type="date" id="ph-${ph}-dl" value="${esc(d.deadline || "")}" /></div>
        <div class="f" style="margin:0;flex:1;min-width:160px"><label>Our status (K&amp;A)</label>
          <select id="ph-${ph}-ka">${opts(KA_STATUS, d.kaStatus)}</select></div>
        ${ph !== "IFC" ? `<div class="f" style="margin:0;flex:1;min-width:170px"><label>Client status</label>
          <select id="ph-${ph}-cl" ${clientLocked ? "disabled" : ""}>${opts(CLIENT_STATUS, d.clientStatus || "Not submitted")}</select>
          ${clientLocked ? '<div class="tiny muted" style="margin-top:3px">Unlocks once submitted</div>' : ""}</div>` : ""}
        <div class="datefact" id="ph-${ph}-facts" style="flex-basis:100%">${facts || "Not started yet — dates stamp automatically."}</div>
      </div></div>`;
    }).join("")}
    <div id="impact"></div>
    <div class="acts">${p ? `<button class="btn btn-d" id="p-del">Delete</button>` : ""}
      <button class="btn btn-s" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-p" id="p-save">Save</button></div>`
  }, () => {
    PHASES.forEach(ph => {
      const kaSel = el(`ph-${ph}-ka`);
      const clSel = el(`ph-${ph}-cl`);
      if (kaSel) kaSel.onchange = () => { if (clSel) clSel.disabled = kaSel.value !== "Submitted"; };
      const dl = el(`ph-${ph}-dl`);
      if (dl && p) dl.onchange = () => showImpact(p, ph, dl.value);
    });
    el("p-save").onclick = async () => {
      const name = val("p-name");
      if (!name) { alert("Enter a project name."); return; }
      const phases = {};
      PHASES.forEach(ph => {
        const prev = p && p.phases && p.phases[ph] ? p.phases[ph] : newProjectShell("", "").phases[ph];
        const newKa = val(`ph-${ph}-ka`);
        const kaJustSubmitted = newKa !== prev.kaStatus && newKa === "Submitted";
        let phaseData = { ...prev, included: el(`ph-${ph}-inc`).checked, deadline: val(`ph-${ph}-dl`) };
        if (newKa !== prev.kaStatus) phaseData = applyKaStatusChange(phaseData, newKa);
        else phaseData.kaStatus = newKa;
        if (ph !== "IFC") {
          const clSel = el(`ph-${ph}-cl`);
          // Skip reading the dropdown when K&A just flipped to Submitted this save: its value is
          // still whatever was rendered before the unlock, and would clobber the auto-set status.
          if (clSel && !clSel.disabled && !kaJustSubmitted) phaseData.clientStatus = clSel.value;
        }
        phases[ph] = phaseData;
      });
      const data = { name, client: val("p-client"), managerId: val("p-mgr"), leadId: val("p-lead"),
        calcWeight: parseFloat(val("p-cw")) || 0.6, phases };
      closeModal();
      if (p) await updateProject(p.id, data, name); else { const nid = await addProject(data); view.projectId = nid; view.tab = "detail"; }
      render();
      toast(p ? `"${name}" saved` : `"${name}" created`);
    };
    if (p) el("p-del").onclick = async () => {
      const n = structuresOf(p.id).length;
      closeModal(); view.tab = "projects";
      await deleteProject(p.id); render();
      toast(`Deleted "${p.name}"${n ? ` and ${n} structure${n === 1 ? "" : "s"}` : ""}`, "Undo",
        async () => { await restoreProject(p.id); render(); });
    };
  });
}
function showImpact(project, phase, newDeadline) {
  const box = el("impact");
  if (!box || !newDeadline) return;
  const affected = state.structures.filter(s => s.projectId === project.id && s.phase === phase && !s.deleted && isActionable(s));
  const people = {};
  affected.forEach(s => {
    [["engineerId", engineerRemainingDays], ["designerId", designerRemainingDays]].forEach(([field, fn]) => {
      const per = personBy(s[field]);
      if (!per) return;
      const sl = slackDaysFor(fn(s), newDeadline, per);
      if (sl != null && sl < 0) { people[per.name] = people[per.name] || []; people[per.name].push(`${s.name} (${round(sl, 1)}d)`); }
    });
  });
  const names = Object.keys(people);
  box.innerHTML = names.length
    ? `<div class="warnbox"><strong>Heads up:</strong> that date doesn't leave ${names.length} person${names.length === 1 ? "" : "s"} enough time — ${names.map(n => `${esc(n)}: ${esc(people[n].join(", "))}`).join(" · ")}</div>`
    : `<div class="okbox">No one goes negative with that date.</div>`;
}

function structureModal(sid, pid) {
  const s = sid ? state.structures.find(x => x.id === sid) : null;
  const projectId = s ? s.projectId : pid;
  const proj = state.projects.find(x => x.id === projectId);
  const inc = proj ? includedPhases(proj) : PHASES;
  const withCurrent = (list, currentId) => {
    if (currentId && !list.some(p => p.id === currentId)) {
      const cur = state.people.find(p => p.id === currentId);
      if (cur) return [...list, cur];
    }
    return list;
  };
  const engineers = withCurrent(activePeople().filter(p => (p.roles || []).includes("Engineer")), s ? s.engineerId : "");
  const designers = withCurrent(activePeople().filter(p => (p.roles || []).includes("Designer")), s ? s.designerId : "");
  const reviewers = activePeople(); // anyone can review
  const steps = (s && s.calcSteps) || {};

  const calcStepsHtml = CALC_STEPS.map(st => `
    <div class="stepline">
      <span class="name">${esc(st.label)}<span class="w">${st.weight}%</span></span>
      <button type="button" class="steptoggle ${steps[st.key] ? "on" : ""}" id="cs-${st.key}"
        onclick="this.classList.toggle('on')"></button>
    </div>`).join("");

  openModal({
    wide: true,
    body: `<h3>${s ? "Edit structure" : "Add structure"}</h3><p class="sub">${esc(proj ? proj.name : "")}</p>
    <div class="f2"><div class="f"><label>Structure name</label><input id="s-name" value="${esc(s ? s.name : "")}" placeholder="STR-04 dead-end" /></div>
      <div class="f"><label>Phase</label><select id="s-phase">${opts(inc.map(p => ({ v: p, l: p + "%" })), s ? s.phase : inc[0], "v", "l")}</select></div></div>
    <div class="f2"><div class="f"><label>Structure type</label><select id="s-type">${opts(state.structureTypes, s ? s.typeId : "", "id", "name", "— none —")}</select></div>
      <div class="f"><label>Blocked / waiting on</label><select id="s-block">${opts(BLOCK_REASONS, s ? s.blockedReason : "", null, null, "— not blocked —")}</select></div></div>

    <div class="row" style="gap:14px;align-items:flex-start;margin-top:6px">
      <div class="rolebox" style="flex:1">
        <div class="rb-head">Calc</div>
        <div class="f2"><div class="f"><label>Engineer</label><select id="s-eng">${opts(engineers, s ? s.engineerId : "", "id", "name", "— unassigned —")}</select></div>
          <div class="f"><label>Estimate (days)</label><input type="number" step="0.5" id="s-ce" value="${s ? s.calcEstDays || "" : ""}" /></div></div>
        <div class="f"><label>Reviewer</label><select id="s-crev">${opts(withCurrent(reviewers, s ? s.calcReviewerId : ""), s ? s.calcReviewerId : "", "id", "name", "— unassigned —")}</select></div>
        ${calcStepsHtml}
      </div>
      <div class="rolebox" style="flex:1">
        <div class="rb-head">Drawing</div>
        <div class="f2"><div class="f"><label>Designer</label><select id="s-des">${opts(designers, s ? s.designerId : "", "id", "name", "— unassigned —")}</select></div>
          <div class="f"><label>Estimate (days)</label><input type="number" step="0.5" id="s-de" value="${s ? s.drawEstDays || "" : ""}" /></div></div>
        <div class="f"><label>Q1 Self check</label><div class="small muted" style="padding:6px 0">Done by the designer once drafting is ready — same estimate above covers this.</div></div>
        <div class="f"><label>Q2 reviewer (engineer check)</label><select id="s-q2">${opts(withCurrent(reviewers, s ? s.drawQ2ReviewerId : ""), s ? s.drawQ2ReviewerId : "", "id", "name", "— unassigned —")}</select></div>
        <div class="f"><label>Q3 reviewer (independent)</label><select id="s-q3">${opts(withCurrent(reviewers, s ? s.drawQ3ReviewerId : ""), s ? s.drawQ3ReviewerId : "", "id", "name", "— unassigned —")}</select></div>
        <div class="f"><label>Q4 reviewer (PE review)</label><select id="s-q4">${opts(withCurrent(reviewers, s ? s.drawQ4ReviewerId : ""), s ? s.drawQ4ReviewerId : "", "id", "name", "— unassigned —")}</select></div>
        <div class="f" style="margin-top:6px"><label>Drawing stage reached</label>${qaBar(s ? s.drawQ : 0, s ? s.id : "new", "drawQ")}</div>
      </div>
    </div>

    ${s ? `<div class="hr"></div><div class="sec-title" style="margin:0 0 8px">Notes on this structure</div>${commentsBlock({ projectId, structureId: s.id })}` : ""}
    <div class="acts">${s ? `<button class="btn btn-d" id="s-del">Delete</button><button class="btn btn-s" id="s-dup">Duplicate</button>` : ""}

      <button class="btn btn-p" id="s-save">Save</button></div>`
  }, () => {
    const tsel = el("s-type");

    };
    el("s-save").onclick = async () => {
      const name = val("s-name");
      if (!name) { alert("Enter a structure name."); return; }
      const newSteps = {};
      CALC_STEPS.forEach(st => { newSteps[st.key] = el(`cs-${st.key}`).classList.contains("on"); });
      const data = {
        projectId, name, phase: val("s-phase"), typeId: val("s-type"),
        calcEstDays: parseFloat(val("s-ce")) || 0, drawEstDays: parseFloat(val("s-de")) || 0,
        engineerId: val("s-eng"), calcReviewerId: val("s-crev"),

      toast(`Deleted "${s.name}"`, "Undo", async () => { await restoreStructure(s.id); render(); });
    };
    if (s) el("s-dup").onclick = async () => {
      closeModal();
      const newId = await duplicateStructure(s.id, { name: `${s.name} (copy)` });
      render();
      toast(`Duplicated "${s.name}" — rename and adjust as needed`);
      structureModal(newId, null);
    };
  });
}

window.__toggleCalcStep = async (sid, key) => {
  const s = state.structures.find(x => x.id === sid);
  if (!s) return;
  const steps = { ...(s.calcSteps || {}) };
  steps[key] = !steps[key];
  await updateStructure(sid, { calcSteps: steps }, `${s.name} calc: ${key} ${steps[key] ? "done" : "reopened"}`);
  render();
};

window.__setQ = async (sid, field, clicked) => {
  const s = state.structures.find(x => x.id === sid);
  if (!s) return;
  const cur = Number(s[field]) || 0;
  const target = clicked === cur ? cur - 1 : clicked;

  if (target < cur) {
    openModal({
      body: `<h3>Send back to Q${target < 0 ? 0 : target}?</h3>
      <p class="sub">${esc(s.name)} — drawing track. Recording why keeps your rework history honest.</p>
      <div class="f"><label>Reason for rejection</label><input id="q-reason" placeholder="e.g. anchor bolt check missing" /></div>
      <div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Cancel</button>
        <button class="btn btn-p" id="q-back">Send back</button></div>`
    }, () => {
      el("q-back").onclick = async () => {
        const reason = val("q-reason");
        closeModal();
        const rw = Number(s.reworkCount || 0) + 1;
        await updateStructure(sid, { [field]: Math.max(0, target), reworkCount: rw }, `${s.name} drawing sent back to Q${Math.max(0, target)}`);
        if (reason) await addComment({ text: `Drawing rejected at Q${cur} → back to Q${Math.max(0, target)}: ${reason}`, projectId: s.projectId, structureId: sid, link: "" });
        render();
      };
    });
    return;
  }
  await updateStructure(sid, { [field]: target }, `${s.name} drawing → Q${target}`);
  render();
};

  openModal({
    body: `<h3>${t ? "Edit type" : "Add structure type"}</h3>
    <div class="f"><label>Type name</label><input id="t-name" value="${esc(t ? t.name : "")}" placeholder="A-frame structure" /></div>
    <div class="f2"><div class="f"><label>Calc estimate (days)</label><input type="number" step="0.5" id="t-c" value="${t ? t.calcEstDays : 3}" /></div>
      <div class="f"><label>Drawing estimate (days)</label><input type="number" step="0.5" id="t-d" value="${t ? t.drawEstDays : 2}" /></div></div>
    <div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-p" id="t-save">Save</button></div>`
  }, () => {
    el("t-save").onclick = async () => {
      const name = val("t-name"); if (!name) return;
      const data = { name, calcEstDays: parseFloat(val("t-c")) || 0, drawEstDays: parseFloat(val("t-d")) || 0 };
      closeModal();
      if (t) await updateType(t.id, data); else await addType(data);
      render();
    };
  });
};
window.__delType = (id) => confirmDialog("Delete this structure type?", async () => { await deleteType(id); render(); });
window.__seedTypes = async () => { const n = await seedTypes(); banner(n ? "" : "Types already loaded."); render(); };

/* ---------------- comments, reassignment ---------------- */
window.__addComment = async (projectId, structureId) => {
  const text = val("cmt-text"); if (!text) return;
  const link = val("cmt-link");
  if (!state.me) { window.__whoami(); return; }
  await addComment({ text, link, projectId: projectId || null, structureId: structureId || null });
  setVal("cmt-text", ""); setVal("cmt-link", "");
  render();
};

const ROLE_LABELS = { engineerId: "Engineer (calc)", calcReviewerId: "Calc reviewer", designerId: "Designer (drawing)",
  drawQ2ReviewerId: "Drawing Q2 reviewer", drawQ3ReviewerId: "Drawing Q3 reviewer", drawQ4ReviewerId: "Drawing Q4 reviewer" };
window.__suggest = (sid, field) => {
  const s = state.structures.find(x => x.id === sid);
  if (!s) return;
  const dl = deadlineFor(s);
  const projectsById = byId(state.projects);
  const list = suggestReassignment(s, ROLE_LABELS[field], field, dl, activePeople(), activeStructures(), projectsById);
  openModal({
    body: `<h3>Who can take "${esc(s.name)}"?</h3><p class="sub">${esc(ROLE_LABELS[field])}, due ${fmtDate(dl)}.</p>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Current load</th><th>Time to spare if assigned</th><th></th></tr></thead><tbody>
      ${list.map(c => `<tr><td>${avatar(c.person.name)} <span style="margin-left:6px">${esc(c.person.name)}</span></td>
        <td class="small">${c.currentLoad} item${c.currentLoad === 1 ? "" : "s"}</td>
        <td>${pill(spareText(c.projectedSlack), "ok")}</td>
        <td><button class="btn btn-s btn-sm" onclick="window.__reassign('${s.id}','${field}','${c.person.id}')">Assign</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="warnbox">No one has enough spare time to take this on before the deadline. The realistic options are moving the deadline or reducing scope.</div>`}
    <div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Close</button></div>`
  });
};
window.__reassign = async (sid, field, pid) => {
  closeModal();
  await updateStructure(sid, { [field]: pid }, "reassigned");
  render();
};

/* ---------------- bulk assign ---------------- */
const BULK_ROLES = [
  ["engineerId", "Engineer (calc)", "Engineer"],
  ["calcReviewerId", "Calc reviewer", null],
  ["designerId", "Designer (drawing)", "Designer"],
  ["drawQ2ReviewerId", "Drawing Q2 reviewer", null],
  ["drawQ3ReviewerId", "Drawing Q3 reviewer", null],
  ["drawQ4ReviewerId", "Drawing Q4 reviewer", null]
];
window.__bulkAssign = (projectId) => {
  const list = structuresOf(projectId);
  if (!list.length) { openModal(`<h3>No structures yet</h3><p class="sub">Add structures to this project first.</p><div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Close</button></div>`); return; }
  openModal({
    wide: true,
    body: `<h3>Bulk assign</h3><p class="sub">Pick a role and a person, choose the structures, then apply.</p>
    <div class="f2">
      <div class="f"><label>Role</label><select id="bulk-role">${opts(BULK_ROLES.map(r => ({ v: r[0], l: r[1] })), "", "v", "l")}</select></div>
      <div class="f"><label>Assign to</label><select id="bulk-person">${opts(activePeople(), "", "id", "name", "— choose —")}</select></div>
    </div>
    <div class="row" style="margin-bottom:8px;gap:14px">
      <label class="toggle-row"><input type="checkbox" id="bulk-all" onchange="document.querySelectorAll('.bulk-chk').forEach(c=>c.checked=this.checked)" /> Select all</label>
      <span class="tiny muted">${list.length} structure${list.length === 1 ? "" : "s"}</span>
    </div>
    <div class="picklist">${list.map(s => `<div class="pickrow"><input type="checkbox" class="bulk-chk" value="${s.id}" />
      <span>${esc(s.name)}</span><span class="tiny muted" style="margin-left:auto">${esc(s.phase)}%</span></div>`).join("")}</div>
    <div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Cancel</button>
      <button class="btn btn-p" id="bulk-apply">Apply</button></div>`
  }, () => {
    el("bulk-role").onchange = () => {
      const role = el("bulk-role").value;
      const meta = BULK_ROLES.find(r => r[0] === role);
      const pool = meta && meta[2] ? activePeople().filter(p => (p.roles || []).includes(meta[2])) : activePeople();
      el("bulk-person").innerHTML = opts(pool, "", "id", "name", "— choose —");
    };
    el("bulk-apply").onclick = async () => {
      const role = val("bulk-role"), person = val("bulk-person");
      const ids = [...document.querySelectorAll(".bulk-chk:checked")].map(c => c.value);
      if (!role || !person) { alert("Pick a role and a person."); return; }
      if (!ids.length) { alert("Select at least one structure."); return; }
      closeModal();
      await Promise.all(ids.map(id => updateStructure(id, { [role]: person }, "bulk reassigned")));
      render();
      toast(`Assigned ${ids.length} structure${ids.length === 1 ? "" : "s"} to ${personName(person)}`);
    };
  });
};

const DRAW_BUCKET_LABELS = { notstarted: "Not started", q1: "Q1", q2: "Q2", q3: "Q3", q4: "Q4", completed: "Completed" };
window.__showDrawingBucket = (key) => {
  const list = (view.drawBuckets && view.drawBuckets[key]) || [];
  const today = new Date();
  openModal({
    wide: true,
    body: `<h3>${esc(DRAW_BUCKET_LABELS[key] || key)}</h3><p class="sub">${list.length} drawing${list.length === 1 ? "" : "s"}</p>
    ${!list.length ? emptyState("Nothing here", "No drawings are currently in this stage.") : `
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Drawing</th><th>Project</th><th>Status</th><th>Assigned on</th><th>Deadline</th><th>Person</th><th>Flags</th>
    </tr></thead><tbody>${list.map(s => {
      const proj = state.projects.find(x => x.id === s.projectId);
      const dl = proj && proj.phases && proj.phases[s.phase] ? proj.phases[s.phase].deadline : null;
      const flags = [];
      if (s.blockedReason) flags.push(s.blockedReason);
      if (isStale(s, today)) flags.push("No update");
      return `<tr style="cursor:pointer" onclick="window.__closeModal();window.__editStructure('${s.id}')">
        <td><strong>${esc(s.name)}</strong></td>
        <td class="small">${esc(proj ? proj.name : "?")}</td>
        <td>${pill(s.phase + "%", "accent")}</td>
        <td class="small">${fmtShort(s.designerAssignedAt)}</td>
        <td class="small">${fmtShort(dl)}</td>
        <td>${avatar(personName(s.designerId))} <span class="small">${esc(personName(s.designerId) || "Unassigned")}</span></td>
        <td class="tiny muted">${esc(flags.join(", ") || "—")}</td></tr>`;
    }).join("")}</tbody></table></div>`}
    <div class="acts"><button class="btn btn-s" onclick="window.__closeModal()">Close</button></div>`
  });
};

window.__openProject = (id) => { view.projectId = id; view.tab = "detail"; render(); window.scrollTo(0, 0); };
window.__go = (tab) => { view.tab = tab; render(); window.scrollTo(0, 0); };
window.__toggleShowCompleted = (v) => { view.showCompleted = v; render(); };

/* ---------------- render ---------------- */
function render() {
  const tabs = [["insights", "Insights"], ["projects", "Projects"], ["mywork", "My work"], ["activity", "Activity"], ["team", "Team"]];
  el("tabs").innerHTML = tabs.map(([k, l]) =>
    `<button class="${view.tab === k || (k === "projects" && view.tab === "detail") ? "on" : ""}" onclick="window.__go('${k}')">${l}</button>`).join("");
  el("who-name").textContent = state.me || "Set your name";

  let html = "";
  if (view.tab === "insights") html = renderInsights();
  else if (view.tab === "projects") html = renderProjects();
  else if (view.tab === "detail") html = renderDetail();
  else if (view.tab === "mywork") html = renderMyWork();
  else if (view.tab === "activity") html = renderActivity();
  else if (view.tab === "team") html = renderTeam();
  el("main").innerHTML = html;
}

/* ---------------- boot ---------------- */
onChange(() => {
  const live = el("live");
  if (allReady() && !live.classList.contains("on")) {
    live.classList.add("on"); el("live-text").textContent = "Live";
    bootIdentity();
  } else {
    render();
  }
});
start(err => banner("Connection problem: " + err.message));
el("who").onclick = () => window.__whoami();
render();

</script>
</body>
</html>
